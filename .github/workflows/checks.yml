name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: afracanet_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: afracanet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U afracanet_test -d afracanet_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://afracanet_test:ci-only-password@localhost:5432/afracanet_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r backend/requirements.lock.txt
      - name: Check PostgreSQL transaction integrity
        run: .venv/bin/python -m pytest -q
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            modules/credit-intelligence/package-lock.json
      - name: Install backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Check backend structure and formatting
        run: |
          .venv/bin/python -m ruff check --select F,I backend
          .venv/bin/python -m ruff format --check backend
      - name: Check transaction integrity
        run: npm run test:backend
      - name: Install frontend
        run: |
          npm ci
          npm ci --prefix modules/credit-intelligence
      - name: Build frontend
        run: |
          npm run check:all
          npm run check:format
          npm run build:all
      - name: Check whole-platform startup
        run: npm run check:startup
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Check browser journey
        run: npm run test:ui
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Fetch isolated judge graph runtime
        shell: bash
        run: |
          curl --fail --location --retry 3 https://dist.neo4j.org/neo4j-community-5.26.32-unix.tar.gz -o "$RUNNER_TEMP/neo4j.tar.gz"
          curl --fail --location --retry 3 https://dist.neo4j.org/neo4j-community-5.26.32-unix.tar.gz.sha256 -o "$RUNNER_TEMP/neo4j.sha256"
          EXPECTED=$(cut -d ' ' -f1 "$RUNNER_TEMP/neo4j.sha256")
          echo "$EXPECTED  $RUNNER_TEMP/neo4j.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/neo4j.tar.gz" -C "$RUNNER_TEMP"
          curl --fail --location --retry 3 https://github.com/neo4j/graph-data-science/releases/download/2.13.4/neo4j-graph-data-science-2.13.4.jar -o "$RUNNER_TEMP/gds.jar"
          echo "10e072f73992224f1159f246c9d6a89da5f3b3434aeffa5be42647edda13a8d8  $RUNNER_TEMP/gds.jar" | sha256sum --check
      - name: Rehearse a clean compact judge environment with actual GDS
        shell: bash
        run: |
          npm run judge:prepare
          npm run judge:start -- --neo4j-home "$RUNNER_TEMP/neo4j-community-5.26.32" --java-home "$JAVA_HOME" --gds-jar "$RUNNER_TEMP/gds.jar" --analytics --check
